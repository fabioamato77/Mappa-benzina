name: Aggiornamento prezzi carburanti

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  aggiorna:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Installa dipendenze Python
        run: pip install pandas requests

      - name: Esegui script aggiornamento
        run: python3 aggiorna_mappa.py

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mappa_carburanti.html
          git diff --cached --quiet && echo "Nessuna modifica" && exit 0
          git commit -m "Aggiornamento prezzi $(date +'%d/%m/%Y')"
          git fetch origin main
          git reset --soft origin/main
          git add mappa_carburanti.html
          git commit -m "Aggiornamento prezzi $(date +'%d/%m/%Y')"
          git push origin main
